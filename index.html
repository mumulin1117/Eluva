<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#c9a6ff" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' eluva://media data: blob:; font-src 'self'; media-src 'self' eluva://media blob: data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'" />
    <link rel="preload" href="/images/auth-background.png" as="image" />
    <link rel="preload" href="/images/launch-logo.png" as="image" />
    <link rel="preload" href="/fonts/plusjakartasans-variable.ttf" as="font" type="font/ttf" crossorigin />
    <title>Eluva</title>
    <script src="/boot.js"></script>
    <style>
      html,body{margin:0;background:#c9a6ff;touch-action:pan-x pan-y}#initial-boot{position:fixed;inset:0;height:100vh;height:100dvh;overflow:hidden;background:#c9a6ff url('/images/auth-background.png') center/cover no-repeat}#initial-boot img{position:absolute;left:50%;top:calc(50% - 50px);width:110px;height:110px;transform:translate(-50%,-50%);object-fit:contain;pointer-events:none;-webkit-user-drag:none}
    </style>
  </head>
  <body>
    <div id="app"><div id="initial-boot" role="status" aria-label="Eluva"><img src="/images/launch-logo.png" alt="" draggable="false" /></div></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
