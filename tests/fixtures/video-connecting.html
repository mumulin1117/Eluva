<!doctype html>
<!-- Isolated QA only; not part of the production Vite entry or native resource bundle. -->
<html><head><base href="/"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Eluva connecting QA</title></head><body><div id="app"></div><script type="module">
import {BrowserRepository} from '/src/services/browser-repository.js'
import {bridge} from '/src/state.js'
import {LEGAL_VERSION} from '/src/domain/validation.js'
const q=new URLSearchParams(location.search),repo=new BrowserRepository({dbName:'eluva-video-qa-'+crypto.randomUUID()}),locale=q.get('locale')==='fr'?'fr':'en';bridge.adapter=repo
await repo.execute('app','bootstrap');await repo.execute('preferences','locale',{locale});await repo.execute('preferences','consent',{accepted:true,version:LEGAL_VERSION});await repo.execute('auth','login',{email:'eluva@gmail.com',password:'123qweasd'})
let outcome=q.get('case')||'unsupported',release
const execute=repo.execute.bind(repo),qa=document.createElement('aside');qa.style.cssText='position:fixed;top:0;right:0;z-index:9999;background:white;color:black;font:9px sans-serif';qa.textContent='Isolated video QA';qa.setAttribute('aria-label','Isolated video controls');document.body.append(qa)
repo.execute=async(service,method,params={},options={})=>{
 if(service==='realtime'&&method==='prepareCall'&&outcome!=='unsupported'){
  await execute('social','requireFriend',{peerId:'demo-friend-echo'},options);await execute('realtime','call',{callId:params.callId},options)
  if(outcome==='hold')await new Promise((resolve,reject)=>{release=resolve;options.signal?.addEventListener('abort',()=>reject({code:'CANCELLED'}),{once:true})})
  if(options.signal?.aborted)throw {code:'CANCELLED'}
  return {callId:params.callId,camera:outcome==='denied'?'denied':'authorized',microphone:outcome==='denied'?'denied':'authorized',environment:'isolated-test'}
 }
 return execute(service,method,params,options)
}
if(q.get('controls')==='1')for(const [label,action]of [['Allow permissions',()=>outcome='granted'],['Release permission response',()=>release?.()],['Block peer',async()=>{await execute('social','block',{peerId:'demo-friend-echo',blocked:true});await (await import('/src/social-state.js')).loadSocial({quiet:true})}]]){const b=document.createElement('button');b.textContent=label;b.onclick=action;qa.append(b)}
if(q.get('safe')==='1'){const style=document.createElement('style');style.textContent=':root{--safe-top:44px!important;--safe-bottom:34px!important}@media(max-height:700px){:root{--safe-top:20px!important;--safe-bottom:0px!important}}@media(width:393px),(width:430px){:root{--safe-top:59px!important;--safe-bottom:34px!important}}';document.head.append(style)}
if(!location.hash)location.hash='/conversation/demo-friend-echo?from=/chats';await import('/src/main.js')
</script></body></html>
