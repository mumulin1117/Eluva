<!doctype html>
<!-- Isolated development-only UI fixture. No commercial policy changes or successful payments. -->
<html><head><base href="/"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Eluva membership QA</title></head><body><div id="app"></div><script type="module">
import {BrowserRepository} from '/src/services/browser-repository.js'
import {bridge,state,saveLocale} from '/src/state.js'
import {commercePolicy} from '/src/domain/commerce.js'
const q=new URLSearchParams(location.search),locale=q.get('locale')==='fr'?'fr':'en',scenario=q.get('scenario')||'empty',repo=new BrowserRepository({dbName:'eluva-membership-ui-'+crypto.randomUUID()});bridge.adapter=repo
await repo.execute('app','bootstrap');await repo.execute('preferences','locale',{locale});await repo.execute('preferences','consent',{accepted:true,version:(await import('/src/domain/validation.js')).LEGAL_VERSION});await repo.execute('auth','login',{email:'eluva@gmail.com',password:'123qweasd'});await repo.execute('content','preferences',{guideDone:true})
const execute=repo.execute.bind(repo);let failed=false,held=scenario==='hold',release,loads=0,purchases=0
const audit=document.createElement('aside');audit.id='membership-qa';audit.setAttribute('aria-label','Isolated membership UI fixture');audit.style.cssText='position:fixed;z-index:9999;top:0;right:0;font:9px sans-serif;background:white;color:#111';audit.textContent='Isolated UI fixture · no purchase';document.body.append(audit)
const products=()=>commercePolicy.products.map((p,i)=>({...p,displayPrice:new Intl.NumberFormat(state.locale,{style:'currency',currency:'USD'}).format([4.99,12.99,39.99][i]),currency:'USD'}))
repo.execute=async(service,method,...args)=>{if(service==='commerce'&&method==='products'){audit.dataset.loads=String(++loads);if(held){held=false;await new Promise(ok=>release=ok)}if(scenario==='failure'&&!failed){failed=true;throw {code:'STORE_FAILED'}}if(scenario!=='empty')return {configured:true,platform:'browser',canPurchase:true,products:products()}}if(service==='commerce'&&method==='purchase'){audit.dataset.purchases=String(++purchases);throw {code:'STORE_NATIVE_ONLY'}}return execute(service,method,...args)}
if(scenario==='hold'){const b=document.createElement('button');b.textContent='Release product read';b.onclick=()=>{release?.();b.remove()};audit.append(b)}
if(q.get('controls')==='1'){const b=document.createElement('button');b.textContent='Switch fixture language';b.onclick=()=>saveLocale(state.locale==='en'?'fr':'en');audit.append(b)}
if(q.get('safe')==='1'){const style=document.createElement('style');style.textContent=':root{--safe-top:44px!important;--safe-bottom:34px!important}@media(max-height:700px){:root{--safe-top:20px!important;--safe-bottom:0px!important}}@media(width:393px),(width:430px){:root{--safe-top:59px!important;--safe-bottom:34px!important}}';document.head.append(style)}
document.documentElement.lang=locale;if(!location.hash)location.hash='/store?from=/edit-profile';await import('/src/main.js')
</script></body></html>
