<!doctype html>
<!-- Isolated development-only publish collection fixture; excluded from production input. -->
<html><head><base href="/"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Eluva collection QA</title></head><body><div id="app"></div><script type="module">
import {BrowserRepository} from '/src/services/browser-repository.js'
import {bridge,state} from '/src/state.js'
const q=new URLSearchParams(location.search),locale=q.get('locale')==='fr'?'fr':'en',repo=new BrowserRepository({dbName:'eluva-compose-collection-'+crypto.randomUUID()});bridge.adapter=repo
await repo.execute('app','bootstrap');await repo.execute('preferences','locale',{locale});await repo.execute('preferences','consent',{accepted:true,version:(await import('/src/domain/validation.js')).LEGAL_VERSION});await repo.execute('auth','login',{email:'eluva@gmail.com',password:'123qweasd'});await repo.execute('content','preferences',{guideDone:true})
if(q.get('safe')==='1'){const style=document.createElement('style');style.textContent=':root{--safe-top:44px!important;--safe-bottom:34px!important}@media(max-height:700px){:root{--safe-top:20px!important;--safe-bottom:0px!important}}@media(width:393px),(width:430px){:root{--safe-top:59px!important;--safe-bottom:34px!important}}';document.head.append(style)}
if(q.get('controls')==='1'){const a=document.createElement('aside');a.id='qa-controls';a.style.cssText='position:fixed;top:0;right:0;z-index:9999;background:white;font:10px sans-serif;display:flex;gap:4px';a.setAttribute('aria-label','Isolated collection fixture controls');for(const [label,action]of [['Fail collection save',()=>{repo.contentFailure='createCollection'}],['Switch language',async()=>{const {saveLocale}=await import('/src/state.js');await saveLocale(state.locale==='en'?'fr':'en')}],['Audit fixture',async()=>{const r=await repo.read();a.dataset.audit=JSON.stringify({posts:Object.keys(r.content.posts).length,collections:Object.values(r.content.collections).filter(x=>x.ownerId===r.session.userId).map(x=>({id:x.id,name:x.name,coverId:x.coverId}))})}]]){const b=document.createElement('button');b.textContent=label;b.onclick=action;a.append(b)}document.body.append(a)}
document.documentElement.lang=locale;if(!location.hash)location.hash='/compose';await import('/src/main.js')
</script></body></html>
