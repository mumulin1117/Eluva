<!doctype html>
<!-- Isolated subscription presentation fixture; never included in the shipped bundle. -->
<html><head><base href="/"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Eluva subscription QA</title></head><body><div id="app"></div><script type="module">
import {BrowserRepository} from '/src/services/browser-repository.js'
import {bridge,state} from '/src/state.js'
import {commerceSnapshot,commercePolicy} from '/src/domain/commerce.js'
const q=new URLSearchParams(location.search),locale=q.get('locale')==='fr'?'fr':'en',scenario=q.get('scenario')||'active',repo=new BrowserRepository({dbName:'eluva-subscription-qa-'+crypto.randomUUID()});bridge.adapter=repo
await repo.execute('app','bootstrap');await repo.execute('preferences','locale',{locale});await repo.execute('preferences','consent',{accepted:true,version:(await import('/src/domain/validation.js')).LEGAL_VERSION});await repo.execute('auth','login',{email:'eluva@gmail.com',password:'123qweasd'});await repo.execute('content','preferences',{guideDone:true})
const now=Date.now()/1000,owner=(await repo.read()).session.userId
const setStatus=async status=>repo.write(root=>{root.commerce??={version:1,accounts:{},transactions:{}};root.commerce.transactions={};if(status!=='none')root.commerce.transactions['xcode:fixture']={ownerId:owner,entitlement:'pro',productId:'eluva_monthly_promember',plan:'monthly',environment:'xcode',originalId:'fixture-original',purchasedAt:new Date().toISOString(),expiresAt:['expired','grace'].includes(status)?now-60:now+86400,willAutoRenew:scenario!=='cancelled-renewal',renewalState:status==='grace'?'gracePeriod':status==='revoked'?'revoked':'active',graceUntil:status==='grace'?now+3600:null};return {state:root,result:{}}})
await setStatus(['active','expired','revoked','grace','cancelled-renewal'].includes(scenario)?scenario:'none')
const audit=document.createElement('aside');audit.id='subscription-qa';audit.setAttribute('aria-label','Isolated subscription test controls');audit.style.cssText='position:fixed;top:0;right:0;z-index:9999;background:white;color:black;font:9px sans-serif';audit.textContent='Isolated UI fixture · no Apple purchase';document.body.append(audit)
let fail=scenario==='restore-failure',release,held=false
const execute=repo.execute.bind(repo)
repo.execute=async(service,method,...args)=>{
 if(service==='commerce'&&method==='products')return {configured:true,platform:'browser',canPurchase:scenario!=='restricted',reason:scenario==='restricted'?'STORE_RESTRICTED':'',products:commercePolicy.products.map((p,i)=>({...p,displayName:p.plan,description:'Fixture only',displayPrice:locale==='fr'?['4,99 $US','12,99 $US','39,99 $US'][i]:['$4.99','$12.99','$39.99'][i],currency:'USD'}))}
 if(service==='commerce'&&['purchase','restore','manage'].includes(method)){
  audit.dataset[method]=String(Number(audit.dataset[method]||0)+1)
  if(held){held=false;await new Promise(resolve=>release=resolve)}
  if(method==='restore'&&fail){fail=false;throw {code:'STORE_FAILED'}}
  const root=await repo.read(),snapshot=commerceSnapshot(root,owner)
  if(method==='purchase')return {status:scenario==='pending'?'pending':'cancelled',snapshot}
  return {status:method==='restore'?(snapshot.subscription.active?'restored':'nothingToRestore'):'',snapshot}
 }
 return execute(service,method,...args)
}
if(q.get('controls')==='1')for(const [label,action]of [['Hold next action',()=>held=true],['Release action',()=>release?.()],['Expire fixture',()=>setStatus('expired')],['Activate fixture',()=>setStatus('active')],['Audit fixture',async()=>{const root=await repo.read();audit.dataset.audit=JSON.stringify({posts:Object.keys(root.content.posts).length,accounts:Object.keys(root.accounts).length,subscription:commerceSnapshot(root,owner).subscription})}]]){const b=document.createElement('button');b.textContent=label;b.onclick=action;audit.append(b)}
if(q.get('safe')==='1'){const style=document.createElement('style');style.textContent=':root{--safe-top:44px!important;--safe-bottom:34px!important}@media(max-height:700px){:root{--safe-top:20px!important;--safe-bottom:0px!important}}@media(width:393px),(width:430px){:root{--safe-top:59px!important;--safe-bottom:34px!important}}';document.head.append(style)}
document.documentElement.lang=locale;if(!location.hash)location.hash='/store?from=/mine';await import('/src/main.js')
</script></body></html>
