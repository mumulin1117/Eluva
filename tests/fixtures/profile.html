<!doctype html><html><head><base href="/"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Eluva profile QA</title></head><body><div id="app"></div><script type="module">
import {BrowserRepository} from '/src/services/browser-repository.js'
import {bridge,state} from '/src/state.js'
const query=new URLSearchParams(location.search),locale=query.get('locale')==='fr'?'fr':'en',scenario=query.get('scenario')||'unfollowed'
const repo=new BrowserRepository({dbName:'eluva-profile-qa-'+crypto.randomUUID()});bridge.adapter=repo
await repo.execute('app','bootstrap');await repo.execute('preferences','locale',{locale});await repo.execute('preferences','consent',{accepted:true,version:(await import('/src/domain/validation.js')).LEGAL_VERSION});await repo.execute('auth','login',{email:'eluva@gmail.com',password:'123qweasd'});await repo.execute('social','snapshot');await repo.execute('content','preferences',{guideDone:true})
let peer
await repo.write(async root=>{const posts=Object.values(root.content.posts).filter(p=>p.id.startsWith('demo-post-female-02'));peer=posts[0].authorId;const owner=root.session.userId
 if(['following','mutual'].includes(scenario))root.social.follows[owner+':'+peer]={senderId:owner,recipientId:peer,createdAt:new Date().toISOString()}
 if(scenario==='mutual')root.social.follows[peer+':'+owner]={senderId:peer,recipientId:owner,createdAt:new Date().toISOString()}
 if(scenario!=='empty')root.content.collections['profile-qa-collection']={id:'profile-qa-collection',ownerId:peer,name:'Quiet days',description:'Small moments worth keeping.',postIds:posts.map(p=>p.id),createdAt:new Date().toISOString()}
 return {state:root,result:{}}
})
if(scenario==='blocking'){const post=Object.values((await repo.read()).content.posts).find(p=>p.authorId===peer);await repo.execute('content','echo',{postId:post.id,lit:true});await repo.execute('social','replyPost',{postId:post.id,body:'A thought about your post.',commitId:crypto.randomUUID()})}
if(scenario==='failure')repo.socialFailure='snapshot'
const originalExecute=repo.execute.bind(repo);let loseReportReply=query.get('lostReportReply')==='1'
repo.execute=async(service,method,...args)=>{const result=await originalExecute(service,method,...args);if(service==='social'&&method==='report'){const r=await repo.read();document.documentElement.dataset.reports=String(Object.keys(r.social.reports).length);if(loseReportReply){loseReportReply=false;const {AppError}=await import('/src/domain/errors.js');throw new AppError('TIMEOUT')}}return result}

if(query.get('safe')==='1'){const style=document.createElement('style');style.textContent=':root{--safe-top:44px!important;--safe-bottom:34px!important}@media(max-height:700px){:root{--safe-top:20px!important;--safe-bottom:0px!important}}@media(width:393px),(width:430px){:root{--safe-top:59px!important;--safe-bottom:34px!important}}';document.head.append(style)}
if(query.get('controls')==='1'){const qa=document.createElement('aside');qa.id='qa-controls';qa.style.cssText='position:fixed;right:0;bottom:0;z-index:9999;display:flex;background:white;font:10px sans-serif';for(const [label,op]of [['Fail follow','follow'],['Fail report','report'],['Fail block','block'],['Fail read','snapshot']]){const b=document.createElement('button');b.textContent=label;b.onclick=()=>{repo.socialFailure=op};qa.append(b)}const lang=document.createElement('button');lang.textContent='Switch language';lang.onclick=async()=>{const {saveLocale}=await import('/src/state.js');await saveLocale(state.locale==='en'?'fr':'en')};qa.append(lang);document.body.append(qa)}
document.documentElement.lang=locale;if(!location.hash)location.hash='/profile/'+peer+'?from='+encodeURIComponent(query.get('from')||'/home');await import('/src/main.js')
</script></body></html>
