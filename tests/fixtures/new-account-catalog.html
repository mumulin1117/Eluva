<!doctype html>
<!-- Isolated regression fixture; never included in the production Vite entry. -->
<html><head><base href="/"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Eluva new account QA</title></head><body><div id="app"></div><script type="module">
import {BrowserRepository} from '/src/services/browser-repository.js'
import {bridge} from '/src/state.js'
import {LEGAL_VERSION} from '/src/domain/validation.js'
import {conversationVersion,quizQuestions} from '/src/data/auth-conversation.js'
const q=new URLSearchParams(location.search),locale=q.get('locale')==='fr'?'fr':'en'
const repo=new BrowserRepository({dbName:'eluva-new-account-qa-'+crypto.randomUUID()});bridge.adapter=repo
await repo.execute('app','bootstrap');await repo.execute('preferences','locale',{locale});await repo.execute('preferences','consent',{accepted:true,version:LEGAL_VERSION})
const flow=await repo.execute('auth','beginRegistration',{email:'catalog-'+crypto.randomUUID()+'@example.com',version:conversationVersion})
await repo.execute('auth','verify',{flowId:flow.flowId,purpose:'signup',code:'567567'});await repo.execute('auth','setRegistrationPassword',{flowId:flow.flowId,password:'password1'})
await repo.execute('auth','completeRegistration',{flowId:flow.flowId,commitId:crypto.randomUUID(),communityAccepted:true,profile:{displayName:'New account',birthday:'2000-01-01',gender:'private',photos:[],about:'',interestIds:[],goalIds:[],icebreakerIds:[]},onboarding:{version:conversationVersion,theme:'purple',answers:quizQuestions.map(question=>({questionId:question.id,status:'skipped',optionId:null,elapsedMs:0}))}})
await repo.execute('content','preferences',{guideDone:true})
let blocked=q.get('case')==='hold',failed=q.get('case')==='failure',release
const execute=repo.execute.bind(repo)
repo.execute=async(service,method,...args)=>{if(service==='social'&&method==='snapshot'){if(blocked)await new Promise(resolve=>release=resolve);if(failed)throw {code:'STORAGE_FAILED'}}return execute(service,method,...args)}
const qa=document.createElement('aside');qa.style.cssText='position:fixed;top:0;right:0;z-index:9999;background:white;color:black;font:9px sans-serif';qa.setAttribute('aria-label','Isolated new account controls');qa.textContent='Isolated new-account QA';document.body.append(qa)
if(q.get('controls')==='1')for(const[label,action]of [['Release read',()=>{blocked=false;release?.()}],['Allow reads',()=>failed=false],['Fail reads',()=>failed=true]]){const button=document.createElement('button');button.textContent=label;button.onclick=action;qa.append(button)}
if(q.get('safe')==='1'){const style=document.createElement('style');style.textContent=':root{--safe-top:44px!important;--safe-bottom:34px!important}@media(max-height:700px){:root{--safe-top:20px!important;--safe-bottom:0px!important}}@media(width:393px),(width:430px){:root{--safe-top:59px!important;--safe-bottom:34px!important}}';document.head.append(style)}
if(!location.hash)location.hash='/home';await import('/src/main.js')
</script></body></html>
